name: Publish platform artifact

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@dandy1103'

      - name: Resolve artifact name
        id: meta
        shell: bash
        run: |
          app="${GITHUB_REPOSITORY#*/}"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [ "$app" = noah-shell ]; then
            echo "base_href=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_href=/remotes/${app#noah-}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app
        env:
          BASE_HREF: ${{ steps.meta.outputs.base_href }}
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const href = process.env.BASE_HREF;
          const config = JSON.parse(readFileSync('angular.json', 'utf8'));
          for (const project of Object.values(config.projects ?? {})) {
            for (const target of Object.values(project.architect ?? {})) {
              if (target?.builder === '@angular-devkit/build-angular:application' && target.options) {
                target.options.baseHref = href;
              }
            }
          }
          writeFileSync('angular.json', `${JSON.stringify(config, null, 2)}\n`);
          EOF
          npm run build

      - name: Package immutable artifact
        shell: bash
        run: |
          app="${{ steps.meta.outputs.app }}"
          mkdir -p release
          tar -C "dist/$app/browser" -czf "release/$app.tar.gz" .

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.6'

      - name: Publish OCI artifact to GHCR
        working-directory: release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-platform"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push --image-spec v1.1 \
            --artifact-type application/vnd.noah.platform.archive.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            "$repository:master-$GITHUB_SHA,build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "${GITHUB_REPOSITORY#*/}.tar.gz:application/gzip"

      - name: Notify develop platform to update channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
        run: |
          gh api repos/Dandy1103/noah-platform/dispatches \
            --method POST \
            -f event_type=platform-artifact-published \
            -F 'client_payload[channel]=develop' \
            -F "client_payload[source_repository]=$GITHUB_REPOSITORY" \
            -F "client_payload[source_branch]=$GITHUB_REF_NAME" \
            -F "client_payload[sha]=$GITHUB_SHA"
