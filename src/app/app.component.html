<div class="shell">
  <noah-header homeHref="/portal" [userName]="userName()" [actions]="headerActions" />
  <noah-navbar [groups]="navGroups()" [currentLabel]="currentLabel()" />

  <div class="shell__body">
    @if (activeApp().layout === 'sidebar') {
      <noah-sidebar [sections]="sidebar()" />
    }
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
