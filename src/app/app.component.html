@if (ready()) {
<div class="shell">
  <noah-header homeHref="/portal" [userName]="userName()" [actions]="headerActions()" />
  <noah-navbar [groups]="navGroups()" [currentLabel]="currentLabel()" />

  <div class="shell__body">
    @if (activeApp().layout === 'sidebar') {
      <noah-sidebar [sections]="sidebar()" />
    }
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
}
@if (loading.phase() !== 'hidden') {
  <noah-loading-mask class="operation-loading" [class.operation-loading--leaving]="loading.phase() === 'leaving'"
    [style.--operation-loading-fade-duration]="loading.fadeDuration" label="處理中..." />
}
<app-toast />
