@if (ready()) {
<div class="shell" [class.shell--sidebar]="activeApp().layout === 'sidebar'">
  <noah-header homeHref="/portal" [productLabel]="currentLabel()" [userName]="userName()" [actions]="headerActions()" />
  <noah-navbar [groups]="navGroups()" [currentLabel]="currentLabel()" [userName]="userName()" [accountActions]="headerActions()" />

  <div class="shell__body">
    @if (activeApp().layout === 'sidebar') {
      <noah-sidebar [sections]="sidebar()" />
    }
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
}
@if (remoteLoading() || loading.phase() !== 'hidden') {
  <noah-loading-mask [phase]="remoteLoading() ? 'visible' : loading.phase()" [fadeDuration]="loading.fadeDuration" label="處理中..." />
}
<app-toast />
